# ──────────────────────────────────────────────────────────────────────────
#  OmniRoute Lite — Build & Push to GHCR (Self-Hosted / Podman)
#
#  Builds on YOUR PC (self-hosted runner, 16GB RAM — no OOM)
#  using Podman (already installed on Aurora/Fedora Atomic).
#
#  Trigger:
#    - Push to `lite` branch
#    - Manual dispatch (workflow_dispatch)
#
#  Pull on VPS:
#    docker pull ghcr.io/dianrestu/omniroute-lite:latest
# ──────────────────────────────────────────────────────────────────────────

name: Build OmniRoute Lite

on:
  push:
    branches: [lite]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/omniroute-lite

jobs:
  build:
    runs-on: self-hosted

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build image (podman)
        run: |
          podman build \
            --build-arg OMNIROUTE_BUILD_MEMORY_MB=6144 \
            --build-arg OMNIROUTE_USE_TURBOPACK=0 \
            -f Dockerfile.lite \
            -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest .
          podman tag ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Push to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | podman login ${{ env.REGISTRY }} \
            -u ${{ github.actor }} --password-stdin
          podman push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          podman push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
