# ──────────────────────────────────────────────────────────────────────────
#  OmniRoute Lite — Build & Push to GHCR
#
#  Builds a lightweight OmniRoute image on GitHub Actions (7GB RAM)
#  and pushes to GitHub Container Registry.
#
#  Trigger:
#    - Push to `lite` branch
#    - Manual dispatch (workflow_dispatch)
#
#  Pull on your VPS:
#    docker pull ghcr.io/dianrestu/omniroute-lite:latest
# ──────────────────────────────────────────────────────────────────────────

name: Build OmniRoute Lite

on:
  push:
    branches: [lite]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/omniroute-lite

jobs:
  build:
    runs-on: self-hosted
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.lite
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            OMNIROUTE_BUILD_MEMORY_MB=6144
            OMNIROUTE_USE_TURBOPACK=0
